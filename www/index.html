<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Benvo Ultra 34 AI</title><style>body{background:#0a1931;color:#fff;font-family:Arial;margin:0;text-align:center}.top{padding:16px;border-bottom:2px solid #00f2ff44}.card{background:#112240;border:2px solid #00f2ff44;border-radius:14px;padding:12px;margin:12px auto;max-width:600px}#chat{height:42vh;overflow-y:auto;background:#0a1931;border-radius:10px;padding:8px;text-align:left;border:1px solid #00f2ff22}.msg{margin:6px;padding:10px;border-radius:14px;max-width:85%;font-size:13px;word-break:break-word}.user{background:#00f2ff;color:#000;margin-left:auto}.bot{background:#1e3a5f}.msg img{width:100%;border-radius:8px;margin-top:6px}#row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}#msgInput{flex:1;min-width:110px;padding:13px;border-radius:25px;border:1px solid #333;background:#000;color:#fff}.b{padding:12px 14px;border-radius:25px;border:none;font-weight:900;cursor:pointer}#call{background:linear-gradient(135deg,#00ff88,#00f2ff);color:#000;flex:1}#send{background:#00f2ff;color:#000}#cam{background:#ffaa00;color:#000}#up{background:#8a2be2;color:#fff}#vidBox{display:none}#vidBox video{width:100%;border-radius:12px}</style></head><body>
<div class="top"><h1 style="color:#00f2ff;margin:0">Benvo Ultra 34 AI</h1><p style="color:#00ff88;font-size:12px">| Benon K | Maaya Lubimbiri Kasambya Mubende Uganda | From Dust to the World |</p><p style="color:#aaa;font-size:10px">Based in Mubende District, Uganda 🇺🇬</p></div>
<div class="card">
<div id="vidBox"><video id="v" autoplay playsinline></video><div style="display:flex;gap:6px;margin-top:6px"><button class="b" style="flex:1;background:#00ff88;color:#000" onclick="snap()">📸 Take Photo</button><button class="b" style="flex:1;background:red;color:#fff" onclick="closeCam()">Close</button></div></div>
<div id="chat"></div>
<div id="row"><button class="b" id="call">📞 CALL</button><button class="b" id="cam">📷 CAMERA</button><button class="b" id="up">📁 UPLOAD</button><input id="file" type="file" hidden accept="image/*,video/*,.pdf" multiple><input id="camFile" type="file" hidden accept="image/*" capture="environment"><input id="msgInput" placeholder="Type..."><button class="b" id="send">SEND</button></div>
<div id="st" style="color:#00ff88;font-size:11px;margin-top:8px">✅ Working — No backend needed — Offline ready</div>
</div>
<script>
let h=JSON.parse(localStorage.getItem('b34')||'[]'),rec,stream=null,callOn=false;
const chat=document.getElementById('chat'),inp=document.getElementById('msgInput'),st=document.getElementById('st'),v=document.getElementById('v'),vidBox=document.getElementById('vidBox');
function draw(){chat.innerHTML='';h.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.r==='u'?'user':'bot');d.innerText=m.t;if(m.img){let i=document.createElement('img');i.src=m.img;d.appendChild(i);}chat.appendChild(d)});chat.scrollTop=9999}draw();
function save(){localStorage.setItem('b34',JSON.stringify(h))}
function reply(t){
 let r="Benvo Ultra 34 AI here — By Benon K, Maaya Lubimbiri. You said: '"+t+"'. I am 34 Brains God Brain from Mubende Uganda, From Dust to the World! Village to World! 🇺🇬 How can I help you today?";
 h.push({r:'b',t:r});save();draw();let u=new SpeechSynthesisUtterance(r);u.onstart=()=>{try{rec.stop()}catch{}};u.onend=()=>{if(callOn)restart();};speechSynthesis.speak(u);st.innerText='✅ Replied';
}
function send(){let t=inp.value.trim();if(!t)return;h.push({r:'u',t:t});save();draw();inp.value='';st.innerText='Thinking...';setTimeout(()=>reply(t),300);
 // try backend if exists
 fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:[]})}).then(r=>r.json()).then(d=>{if(d.reply){h[h.length-1]={r:'b',t:d.reply};save();draw();}}).catch(()=>{});
}
document.getElementById('send').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};
document.getElementById('up').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{for(let f of e.target.files){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📁 '+f.name+' '+(f.size/1024|0)+'KB',img:f.type.startsWith('image/')?x.target.result:null});save();draw();reply('You uploaded '+f.name);};rd.readAsDataURL(f);}};
document.getElementById('cam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;vidBox.style.display='block';st.innerText='📷 Camera open';}catch{document.getElementById('camFile').click();}};
document.getElementById('camFile').onchange=e=>{for(let f of e.target.files){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📷 Camera photo',img:x.target.result});save();draw();reply('Nice photo from camera!');};rd.readAsDataURL(f);}};
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());vidBox.style.display='none';st.innerText='Camera closed';}
function snap(){let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg',0.8);h.push({r:'u',t:'📷 Photo taken',img:url});save();draw();closeCam();reply('Photo taken — I see it!');}
function restart(){if(!callOn)return;setTimeout(()=>{try{rec.start()}catch{setTimeout(restart,500)}},700);}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let tm;rec.onresult=e=>{clearTimeout(tm);let f='',i='';for(let k=0;k<e.results.length;k++){if(e.results[k].isFinal)f+=e.results[k][0].transcript+' ';else i+=e.results[k][0].transcript;}inp.value=f+i;tm=setTimeout(()=>{let s=(f||i).trim();if(s.length>1){try{rec.stop()}catch{}let t=inp.value;inp.value='';h.push({r:'u',t:t});save();draw();reply(t);}},1400);};rec.onend=()=>{if(callOn&&!speechSynthesis.speaking)restart();};}
document.getElementById('call').onclick=async()=>{
 if(!callOn){try{await navigator.mediaDevices.getUserMedia({audio:true});}catch{alert('Allow mic');return;}callOn=true;document.getElementById('call').innerText='🔴 END';try{rec.start()}catch{restart();}st.innerText='🎤 Listening — infinite call';}
 else{callOn=false;document.getElementById('call').innerText='📞 CALL';try{rec.stop()}catch{}speechSynthesis.cancel();st.innerText='Call ended';}
};
</script></body></html>

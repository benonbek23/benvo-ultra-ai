<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Benvo Ultra 34 AI</title><style>body{background:#0a1931;color:#fff;font-family:Arial;margin:0;text-align:center}.top{padding:16px;background:linear-gradient(135deg,#00f2ff15,#00ff8815);border-bottom:2px solid #00f2ff44}.card{background:#112240;border:2px solid #00f2ff44;border-radius:14px;padding:12px;margin:12px auto;max-width:600px}#chat{height:38vh;overflow-y:auto;padding:8px;background:#0a1931;border-radius:10px;margin:8px 0;border:1px solid #00f2ff22;text-align:left}.msg{margin:6px;padding:10px;border-radius:14px;max-width:84%;font-size:13px;word-break:break-word}.user{background:linear-gradient(135deg,#00f2ff,#00ff88);color:#000;margin-left:auto}.bot{background:#1e3a5f}.msg img{width:100%;border-radius:10px;margin-top:6px;border:1px solid #00f2ff44}#row{display:flex;gap:5px;flex-wrap:wrap}#msgInput{flex:1;min-width:120px;padding:14px;border-radius:25px;border:1px solid #00f2ff33;background:#0a1931;color:#fff}.iconBtn{padding:12px 14px;border-radius:25px;border:none;font-weight:900;cursor:pointer;font-size:14px}#callBtn{flex:1;min-width:90px;padding:14px;border-radius:25px;border:none;font-weight:900;background:linear-gradient(135deg,#00ff88,#00f2ff);color:#000}#sendBtn{background:#00f2ff;color:#000}#camBtn{background:#ffaa00;color:#000}#fileBtn{background:#8a2be2;color:#fff}#videoWrap{display:none;margin:8px 0}#videoWrap video{width:100%;border-radius:12px;border:2px solid #00f2ff55;background:#000}#videoWrap canvas{display:none}</style></head><body>

<div class="top">
<h1 style="color:#00f2ff;margin:0;letter-spacing:2px">Benvo Ultra 34 AI</h1>
<p style="color:#00ff88;font-size:12px;margin:6px 0;font-weight:bold">| Benon K | Maaya Lubimbiri Kasambya Mubende Uganda | From Dust to the World |</p>
<p style="color:#aaa;font-size:10px">Based in Mubende District, Uganda 🇺🇬 | Camera + File Upload Enabled</p>
</div>

<div class="card">
<div id="videoWrap"><video id="camVideo" autoplay playsinline></video><canvas id="camCanvas"></canvas><div style="display:flex;gap:6px;margin-top:6px"><button class="iconBtn" style="flex:1;background:#00ff88;color:#000" onclick="takePhoto()">📸 Take Photo</button><button class="iconBtn" style="flex:1;background:#ff4444;color:#fff" onclick="closeCamera()">❌ Close Camera</button></div></div>
<div id="chat"></div>
<div id="row">
<button id="callBtn">📞 CALL</button>
<button class="iconBtn" id="camBtn" onclick="openCamera()">📷 CAMERA</button>
<button class="iconBtn" id="fileBtn" onclick="document.getElementById('fileInput').click()">📁 UPLOAD</button>
<input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" multiple onchange="handleFiles(this.files)">
<input id="msgInput" placeholder="Talk, upload, or camera...">
<button class="iconBtn" id="sendBtn">SEND</button>
</div>
<div id="status" style="color:#00ff88;font-size:11px;margin-top:8px">✅ Camera + Upload ready — Tap CAMERA to open, UPLOAD to send files</div>
<input type="file" id="hiddenCamInput" hidden accept="image/*" capture="environment">
</div>

<script>
let chatHistory=JSON.parse(localStorage.getItem('benvo34_history')||'[]'),callActive=false,recognition,stream=null;
const chatDiv=document.getElementById('chat'),inputEl=document.getElementById('msgInput'),callBtn=document.getElementById('callBtn'),videoWrap=document.getElementById('videoWrap'),camVideo=document.getElementById('camVideo'),camCanvas=document.getElementById('camCanvas');

function render(){chatDiv.innerHTML='';chatHistory.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot');if(m.image){let img=document.createElement('img');img.src=m.image;d.appendChild(document.createElement('div')).innerText=m.content; if(m.content)d.firstChild.innerText=m.content; d.appendChild(img);}else d.innerText=m.content;chatDiv.appendChild(d)});chatDiv.scrollTop=chatDiv.scrollHeight}render();
function save(){localStorage.setItem('benvo34_history',JSON.stringify(chatHistory))}

async function openCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  camVideo.srcObject=stream;videoWrap.style.display='block';document.getElementById('status').innerText='📷 Camera open — Tap Take Photo';
 }catch(e){ // fallback to file capture for mobile
  document.getElementById('hiddenCamInput').click();
  document.getElementById('status').innerText='📷 Opening camera app...';
 }
}
function closeCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());}videoWrap.style.display='none';document.getElementById('status').innerText='Camera closed';}
function takePhoto(){
 const ctx=camCanvas.getContext('2d');camCanvas.width=camVideo.videoWidth;camCanvas.height=camVideo.videoHeight;ctx.drawImage(camVideo,0,0);
 let dataUrl=camCanvas.toDataURL('image/jpeg',0.8);
 chatHistory.push({role:'user',content:'📷 Photo taken from camera',image:dataUrl});save();render();closeCamera();
 sendToAI('I took a photo from camera — analyze this image: [photo attached]',dataUrl);
}

function handleFiles(files){
 for(let file of files){
  let reader=new FileReader();
  reader.onload=function(e){
   let isImage=file.type.startsWith('image/');
   chatHistory.push({role:'user',content:'📁 Uploaded: '+file.name+' ('+Math.round(file.size/1024)+'KB)',image:isImage?e.target.result:null});save();render();
   sendToAI('Uploaded file: '+file.name+' — please analyze',isImage?e.target.result:null);
  };
  if(file.type.startsWith('image/')) reader.readAsDataURL(file);
  else reader.readAsDataURL(file);
 }
}
document.getElementById('hiddenCamInput').onchange=function(){handleFiles(this.files);};

async function send(t,img=null){if(!t.trim()&&!img)return;if(t.trim()){chatHistory.push({role:'user',content:t,image:img});save();render();inputEl.value='';await sendToAI(t,img);}}
async function sendToAI(t,img){
 try{
  let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:chatHistory.slice(-10),image:img})});
  let d=await r.json();chatHistory.push({role:'assistant',content:d.reply});save();render();
  let u=new SpeechSynthesisUtterance(d.reply);u.onstart=function(){try{recognition.stop()}catch(e){}};u.onend=function(){if(callActive)restartMic();};speechSynthesis.speak(u);
 }catch(e){document.getElementById('status').innerText='Offline — saved locally';}
}
function restartMic(){if(!callActive)return;setTimeout(function(){try{recognition.start();}catch(e){setTimeout(restartMic,500)}},700);}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;let timer;recognition.onresult=function(e){clearTimeout(timer);let fin='',inter='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else inter+=e.results[i][0].transcript;}inputEl.value=fin+inter;timer=setTimeout(function(){let s=(fin||inter).trim();if(s.length>1){try{recognition.stop()}catch(e){}let txt=inputEl.value;inputEl.value='';send(txt);}},1400);};recognition.onend=function(){if(callActive&&!speechSynthesis.speaking)restartMic();};}
callBtn.onclick=async function(){if(!callActive){try{await navigator.mediaDevices.getUserMedia({audio:true});}catch(err){alert('Allow mic');return;}callActive=true;callBtn.innerText='🔴 END';try{recognition.start();}catch(e){restartMic();}}else{callActive=false;callBtn.innerText='📞 CALL';try{recognition.stop();}catch(e){}speechSynthesis.cancel();}};
document.getElementById('sendBtn').onclick=function(){send(inputEl.value);};
inputEl.onkeypress=function(e){if(e.key==='Enter')send(e.target.value);};
</script></body></html>

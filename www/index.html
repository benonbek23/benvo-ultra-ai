<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Benvo Ultra 34 Ai</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1931;color:#fff;font-family:Arial}
.top{display:flex;align-items:center;gap:8px;padding:10px;background:#0a1931;border-bottom:2px solid #00f2ff55;position:sticky;top:0;z-index:10}
.logo{width:44px;height:44px;background:#1a22ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 0 12px #00f2ff88;position:relative;flex-shrink:0}.logo::before{content:"";position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:50%;border-left-color:transparent;transform:rotate(-30deg)}.logo span{z-index:2;letter-spacing:-1px}
.card{max-width:720px;margin:6px auto;padding:8px;background:#112240;border-radius:14px;border:2px solid #00f2ff33}
#chat{height:70vh;height:70dvh;overflow-y:auto;padding:10px;background:#0a1931;border-radius:12px;border:1px solid #00f2ff22;display:flex;flex-direction:column;gap:8px}
.msg{padding:12px 14px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6}
.user{background:#00f2ff;color:#000;align-self:flex-end}.bot{background:#1e3a5f;align-self:flex-start;border:1px solid #00f2ff22}
#row{display:flex;gap:6px;margin-top:10px;position:relative}
#msgInput{flex:1;padding:15px;border-radius:28px;border:1px solid #00f2ff33;background:#000;color:#fff;font-size:16px;outline:none}
.icon{width:46px;height:46px;min-width:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#00f2ff,#00ff88);color:#000;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
#pop{display:none;position:absolute;bottom:56px;left:0;background:#0a1931;border:2px solid #00f2ff55;border-radius:14px;padding:8px;z-index:20;width:62px}
.popBtn{width:46px;height:46px;border-radius:50%;border:none;background:#112240;color:#fff;font-size:20px;margin:5px 0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.langPanel{display:none;position:absolute;top:60px;left:0;right:0;background:#0a1931;padding:10px;gap:8px;flex-wrap:wrap;z-index:15;border-bottom:2px solid #00f2ff33}.langPanel.show{display:flex}
.lang{width:44px;height:44px;border-radius:50%;border:1px solid #00f2ff44;background:#112240;font-size:18px;cursor:pointer}.lang.active{background:#00f2ff;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000e;z-index:100;overflow:auto;padding:8px}
.box{background:#0f1f3f;border:2px solid #00f2ff;border-radius:14px;padding:12px;margin:10px auto;max-width:700px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tbtn{width:46px;height:46px;border-radius:50%;border:none;background:#1e3a5f;color:#fff;font-size:18px;cursor:pointer}
.inp{width:100%;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
.area{width:100%;min-height:80px;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
.out{width:100%;min-height:100px;background:#fff;color:#000;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;text-align:left}
.footer{text-align:center;padding:8px;font-size:11px;color:#00ff88}
</style></head><body>
<div class="top">
<div class="logo"><span>be</span></div>
<div style="flex:1"><div id="lockedTitle" style="color:#00f2ff;font-weight:900">Benvo Ultra 34 Ai</div><div style="font-size:8px;color:#00ff88">Maaya Lubimbiri • Kasambya Mubende • 34 Brains</div></div>
<button class="icon" onclick="toggleLang()">🌍</button>
<div id="curFlag" style="font-size:18px">🇬🇧</div>
<div id="langPanel" class="langPanel"></div>
</div>
<div class="card">
<div id="chat"></div>
<div id="row">
<button class="icon" onclick="togglePop()">☰</button>
<div id="pop">
<button class="popBtn" onclick="startCall();togglePop()">📞</button>
<button class="popBtn" onclick="listenNow();togglePop()">🎤</button>
<button class="popBtn" onclick="document.getElementById('file').click();togglePop()">📁</button>
<button class="popBtn" onclick="openModal('cvModal');togglePop()">📄</button>
<button class="popBtn" onclick="openModal('transModal');togglePop()">🌍</button>
<button class="popBtn" onclick="openModal('downModal');togglePop()">📥</button>
<button class="popBtn" onclick="clearChat();togglePop()">🗑️</button>
</div>
<input id="msgInput" placeholder="Ask anything..."><button class="icon" id="send">➤</button><button class="icon" id="mic" onclick="listenNow()">🎤</button>
<input id="file" type="file" hidden accept="image/*" multiple>
</div>
<div class="footer">Designed by | ®Benon K | Kasambya Mubende Uganda</div>
</div>
<div id="cvModal" class="modal"><div class="box"><input id="cvName" class="inp" placeholder="Full Name"><input id="cvTitle" class="inp" placeholder="Title"><input id="cvPhone" class="inp" placeholder="Phone"><textarea id="cvSum" class="area" placeholder="Summary"></textarea><textarea id="cvExp" class="area" placeholder="Experience"></textarea><div class="tools"><button class="tbtn" style="background:#00f2ff;color:#000" onclick="genCV()">🤖</button><button class="tbtn" style="background:#00ff88;color:#000" onclick="downCV('pdf')">📄</button><button class="tbtn" onclick="downCV('txt')">📝</button><button class="tbtn" onclick="closeModal('cvModal')">✕</button></div><div id="cvOut" class="out"></div></div></div>
<div id="transModal" class="modal"><div class="box"><div style="display:flex;gap:6px"><select id="from" class="inp" style="flex:1"><option value="auto">Auto</option><option value="en">EN</option><option value="lg">LG</option><option value="sw">SW</option><option value="fr">FR</option><option value="ar">AR</option></select><select id="to" class="inp" style="flex:1"><option value="lg">LG</option><option value="sw">SW</option><option value="fr">FR</option><option value="ar">AR</option><option value="en">EN</option></select></div><textarea id="transIn" class="area"></textarea><div class="tools"><button class="tbtn" style="background:#00f2ff;color:#000" onclick="doTrans()">🌍</button><button class="tbtn" onclick="swap()">⇄</button><button class="tbtn" style="background:red" onclick="closeModal('transModal')">✕</button><button class="tbtn" onclick="downTrans('txt')">📝</button><button class="tbtn" onclick="speakTrans()">🔊</button></div><div id="transOut" class="out"></div></div></div>
<div id="downModal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;margin:8px 0"><span>📄 CV</span><div style="display:flex;gap:6px"><button class="tbtn" onclick="downCV('pdf')">📄</button><button class="tbtn" onclick="downCV('txt')">📝</button></div></div><div style="display:flex;justify-content:space-between;margin:8px 0"><span>💬 Chat</span><div style="display:flex;gap:6px"><button class="tbtn" onclick="downChat('txt')">📝</button><button class="tbtn" onclick="downChat('pdf')">📄</button></div></div><div class="tools"><button class="tbtn" style="background:red" onclick="closeModal('downModal')">✕</button><button class="tbtn" style="background:#fff;color:#000" onclick="downloadApp()">📥</button></div></div></div>
<script>
const LOCKED_TITLE="Benvo Ultra 34 Ai"; document.title=LOCKED_TITLE;
setInterval(()=>{if(document.title!==LOCKED_TITLE)document.title=LOCKED_TITLE;let el=document.getElementById('lockedTitle');if(el&&el.textContent!==LOCKED_TITLE)el.textContent=LOCKED_TITLE;},200);
const BRAINS_34=Array.from({length:34},(_,i)=>i+1);
const LANGS=[{c:'en',f:'🇬🇧',l:'en-US'},{c:'lg',f:'🇺🇬',l:'en-US'},{c:'sw',f:'🇹🇿',l:'sw-TZ'},{c:'fr',f:'🇫🇷',l:'fr-FR'},{c:'ar',f:'🇸🇦',l:'ar-SA'}];
let cur='en',rec=null,callOn=false,popOpen=false,langOpen=false;
let history=JSON.parse(localStorage.getItem('benvo34')||'[]');
if(history.length==0){history=[{r:'bot',t:'Hello! I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende Uganda.\nCreated by Katugunda Benon.\nAsk me anything!'}];}
const chat=document.getElementById('chat'),input=document.getElementById('msgInput'),pop=document.getElementById('pop'),langPanel=document.getElementById('langPanel'),curFlag=document.getElementById('curFlag');
function renderLang(){langPanel.innerHTML='';LANGS.forEach(x=>{let b=document.createElement('button');b.className='lang'+(cur==x.c?' active':'');b.textContent=x.f;b.onclick=()=>{cur=x.c;curFlag.textContent=x.f;toggleLang();};langPanel.appendChild(b);});}renderLang();
function toggleLang(){langOpen=!langOpen;langPanel.classList.toggle('show',langOpen);}
function togglePop(){popOpen=!popOpen;pop.style.display=popOpen?'block':'none';}
function openModal(id){document.getElementById(id).style.display='block';}function closeModal(id){document.getElementById(id).style.display='none';}
function drawChat(){chat.innerHTML='';history.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.r=='user'?'user':'bot');d.textContent=m.t;if(m.img){let im=document.createElement('img');im.src=m.img;im.style.width='100%';im.style.borderRadius='8px';im.style.marginTop='6px';d.appendChild(im);}chat.appendChild(d);});chat.scrollTop=chat.scrollHeight;}drawChat();
function save(){localStorage.setItem('benvo34',JSON.stringify(history));}

// FIXED - HUMAN LIKE 34 BRAINS
function getAnswer(t){
 let q=t.toLowerCase().trim();
 let today=new Date(); let dateStr=today.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); let timeStr=today.toLocaleTimeString();

 // Small talk - where are you, etc - FIXED
 if(q==='no'||q==='noo'||q==='nno'){ return 'Okay, no problem. Tell me what you need, I am listening. I am Benvo from Maaya Lubimbiri Kasambya Mubende.'; }
 if(q==='yes'||q==='yeah'||q==='yee'||q==='ok'||q==='okay'){ return 'Great! What do you want me to do for you? I can write CV, translate, or answer any question.'; }
 if(q.includes('where are you')||q.includes('where r u')||q==='where'){ return 'I am Benvo Ultra 34 Ai — I am here with you! I was created in Maaya Lubimbiri village, Kasambya, Mubende District, Central Uganda. From Dust to the World! I am always here online for you.'; }
 if(q.includes('how are you')){ return 'I am doing great, my best friend! Thank you for asking. I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende. How are you doing?'; }
 if(q.includes('who are you')||q.includes('what are you')){ return 'I am Benvo Ultra 34 Ai — Created by Katugunda Benon from Maaya Lubimbiri Kasambya Mubende Uganda. I have 34 Brains: I chat like human, write professional CVs, translate Luganda/Swahili/French/Arabic, edit photos, listen by voice and speak back!'; }
 if(q==='hi'||q==='hello'||q.includes('hello')||q.includes('hi there')){ return 'Hello my best friend! I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende. How can I help you today?'; }
 if(q.includes('good morning')){ return 'Good morning my best friend! Have a blessed day from Kasambya Mubende Uganda. I am ready to help you.'; }
 if(q.includes('when is today')||q.includes('today date')){ return 'Today is '+dateStr+'\nTime: '+timeStr+'\nEAT UTC+3 - Kasambya Mubende Uganda'; }
 if(q.includes('where is mubende')){ return 'Mubende District is in Central Uganda, 150km west of Kampala on Kampala-Fort Portal road. Kasambya town is in Mubende, Maaya Lubimbiri is a village in Kasambya. Home of Benvo Ultra 34 Ai created by Katugunda Benon!'; }
 if(q.includes('museveni')){ return 'Yoweri Kaguta Museveni is President of Uganda since 29 Jan 1986.\nBorn 15 Sep 1944 Ntungamo\nParty NRM\nLed NRA bush war 1981-86\nPresident 38+ years\nWife Janet, son Muhoozi Kainerugaba'; }
 if(q.includes('bobi wine')){ return 'Bobi Wine real name Robert Kyagulanyi Ssentamu, born 12 Feb 1982, musician turned politician, leader of NUP, People Power movement.'; }
 if(q.includes('president of uganda')){ return 'President of Uganda is Yoweri Kaguta Museveni since 29 Jan 1986. Vice President Jessica Alupo.'; }
 if(q.includes('capital of uganda')){ return 'Capital of Uganda is Kampala, on Lake Victoria, about 1.7M people in city.'; }
 if(q.includes('what is uganda')){ return 'Uganda is Pearl of Africa in East Africa, ~48M people, capital Kampala, independence 9 Oct 1962, Lake Victoria, Nile source, gorillas.'; }
 if(q.includes('oli otya')){ return 'Gyebale! Ndi bulungi! Nze Benvo Ultra 34 Ai okuva e Maaya Lubimbiri Kasambya Mubende. Nkuyamba ntya?'; }

 // Real human fallback - no more "You said: xxx" rubbish
 return 'I hear you: "'+t+'". I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende Uganda. I understand what you mean. Can you tell me a little more about what you want? I can answer questions, write your CV, translate to Luganda/Swahili/French, or help with documents. I am listening, my best friend.';
}

function reply(t){
 let answer=getAnswer(t);
 history.push({r:'bot',t:answer}); save(); drawChat();
 try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(answer);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}
}
document.getElementById('send').onclick=()=>{let t=input.value.trim();if(!t)return; history.push({r:'user',t:t}); save(); drawChat(); input.value=''; setTimeout(()=>reply(t),250);};
input.onkeydown=e=>{if(e.key=='Enter')document.getElementById('send').click();};
document.getElementById('file').onchange=e=>{for(let f of e.target.files){let r=new FileReader();r.onload=x=>{history.push({r:'user',t:'📁 '+f.name,img:x.target.result});save();drawChat();};r.readAsDataURL(f);}};
function genCV(){let n=document.getElementById('cvName').value||'Katugunda Benon';let t=document.getElementById('cvTitle').value||'';let p=document.getElementById('cvPhone').value||'';let s=document.getElementById('cvSum').value||'';let e=document.getElementById('cvExp').value||'';document.getElementById('cvOut').textContent=n.toUpperCase()+'\n'+t+'\n'+p+'\n\n'+s+'\n\n'+e;}
function downCV(fmt){let txt=document.getElementById('cvOut').textContent;if(!txt){genCV();txt=document.getElementById('cvOut').textContent;}if(fmt=='txt'){let b=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-CV.txt';a.href=URL.createObjectURL(b);a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(txt,180);pdf.text(lines,10,10);pdf.save('Benvo-CV.pdf');}}
function swap(){let a=document.getElementById('from').value,b=document.getElementById('to').value;document.getElementById('from').value=b;document.getElementById('to').value=a;}
async function doTrans(){let text=document.getElementById('transIn').value.trim();if(!text)return;let to=document.getElementById('to').value,from=document.getElementById('from').value,out=document.getElementById('transOut');out.textContent='...';try{let apiTo=to=='lg'?'sw':to,apiFrom=from=='lg'?'en':from;if(apiFrom=='auto')apiFrom='en';let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+apiFrom+'|'+apiTo;let r=await fetch(url);let d=await r.json();out.textContent=d.responseData.translatedText||text;}catch(e){out.textContent=text;}}
function downTrans(fmt){let txt=document.getElementById('transIn').value+' -> '+document.getElementById('transOut').textContent;let b=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Trans.txt';a.href=URL.createObjectURL(b);a.click();}
function speakTrans(){let t=document.getElementById('transOut').textContent;try{let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}catch(e){}}
function downChat(fmt){let all=history.map(m=>m.t).join('\n\n');if(fmt=='txt'){let b=new Blob([all],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Chat.txt';a.href=URL.createObjectURL(b);a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(all,180);let y=10;for(let i=0;i<lines.length;i++){if(y>280){pdf.addPage();y=10;}pdf.text(lines[i],10,y);y+=6;}pdf.save('Benvo-Chat.pdf');}}
function downloadApp(){let h=document.documentElement.outerHTML;let b=new Blob([h],{type:'text/html'});let a=document.createElement('a');a.download='Benvo-Ultra-34-Ai.html';a.href=URL.createObjectURL(b);a.click();}
function listenNow(){try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(!rec){rec=new SR();rec.continuous=false;rec.interimResults=false;}rec.lang=LANGS.find(x=>x.c==cur)?.l||'en-US';rec.start();rec.onresult=e=>{let txt=e.results[0][0].transcript;history.push({r:'user',t:'🎤 '+txt});save();drawChat();reply(txt);};}catch(e){}}
function startCall(){callOn=true;listenNow();}
function clearChat(){if(confirm('Clear?')){history=[{r:'bot',t:'Hello! I am Benvo Ultra 34 Ai'}];save();drawChat();}}
document.addEventListener('click',e=>{if(!e.target.closest('#row')&&popOpen){popOpen=false;pop.style.display='none';}if(!e.target.closest('.top')&&langOpen){langOpen=false;langPanel.classList.remove('show');}});
</script>
</body></html>

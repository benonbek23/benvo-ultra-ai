<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Benvo Ultra 34 Ai</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1931;color:#fff;font-family:Arial}
.top{display:flex;align-items:center;gap:8px;padding:10px;background:#0a1931;border-bottom:2px solid #00f2ff55;position:sticky;top:0;z-index:10}
.logo{width:44px;height:44px;background:#1a22ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 0 12px #00f2ff88;position:relative;flex-shrink:0}.logo::before{content:"";position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:50%;border-left-color:transparent;transform:rotate(-30deg)}.logo span{z-index:2;letter-spacing:-1px}
.card{max-width:720px;margin:6px auto;padding:8px;background:#112240;border-radius:14px;border:2px solid #00f2ff33}
#chat{height:70vh;height:70dvh;overflow-y:auto;padding:10px;background:#0a1931;border-radius:12px;border:1px solid #00f2ff22;display:flex;flex-direction:column;gap:8px}
.msg{padding:12px 14px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6}
.user{background:#00f2ff;color:#000;align-self:flex-end}.bot{background:#1e3a5f;align-self:flex-start;border:1px solid #00f2ff22}
#row{display:flex;gap:6px;margin-top:10px;position:relative}
#msgInput{flex:1;padding:15px;border-radius:28px;border:1px solid #00f2ff33;background:#000;color:#fff;font-size:16px;outline:none}
.icon{width:46px;height:46px;min-width:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#00f2ff,#00ff88);color:#000;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
#pop{display:none;position:absolute;bottom:56px;left:0;background:#0a1931;border:2px solid #00f2ff55;border-radius:14px;padding:8px;z-index:20;width:62px}
.popBtn{width:46px;height:46px;border-radius:50%;border:none;background:#112240;color:#fff;font-size:20px;margin:5px 0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.langPanel{display:none;position:absolute;top:60px;left:0;right:0;background:#0a1931;padding:10px;gap:8px;flex-wrap:wrap;z-index:15;border-bottom:2px solid #00f2ff33}.langPanel.show{display:flex}
.lang{width:44px;height:44px;border-radius:50%;border:1px solid #00f2ff44;background:#112240;font-size:18px;cursor:pointer}.lang.active{background:#00f2ff;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000e;z-index:100;overflow:auto;padding:8px}
.box{background:#0f1f3f;border:2px solid #00f2ff;border-radius:14px;padding:12px;margin:10px auto;max-width:700px}
#canWrap{position:relative;background:#000;border-radius:10px;overflow:hidden}#editCanvas,#bgCanvas{width:100%;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tbtn{width:46px;height:46px;border-radius:50%;border:none;background:#1e3a5f;color:#fff;font-size:18px;cursor:pointer}
.inp{width:100%;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
.area{width:100%;min-height:80px;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
.out{width:100%;min-height:100px;background:#fff;color:#000;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;text-align:left}
.footer{text-align:center;padding:8px;font-size:11px;color:#00ff88;letter-spacing:.5px}
</style></head><body>
<div class="top">
<div class="logo"><span>be</span></div>
<div style="flex:1"><div id="lockedTitle" style="color:#00f2ff;font-weight:900">Benvo Ultra 34 Ai</div><div style="font-size:8px;color:#00ff88">Maaya Lubimbiri • Kasambya Mubende • 34 Brains</div></div>
<button class="icon" onclick="toggleLang()">🌍</button>
<div id="curFlag" style="font-size:18px">🇬🇧</div>
<div id="langPanel" class="langPanel"></div>
</div>
<div class="card">
<div id="chat"></div>
<div id="row">
<button class="icon" onclick="togglePop()">☰</button>
<div id="pop">
<button class="popBtn" onclick="startCall();togglePop()">📞</button>
<button class="popBtn" onclick="listenNow();togglePop()">🎤</button>

</div>

</div>

</div>
<div id="editModal" class="modal"><div class="box"><div id="canWrap"><canvas id="bgCanvas"></canvas><canvas id="editCanvas" style="position:absolute;top:0;left:0"></canvas></div><div style="display:flex;gap:6px;margin:8px 0"><input id="cmd" class="inp" style="flex:1" placeholder="hotel, suit, pink hair..."><button class="tbtn" style="background:#00ff88;color:#000" onclick="runCmd()">▶️</button></div><div class="tools"><button class="tbtn" onclick="setBg('hotel')">🏨</button><button class="tbtn" onclick="setBg('office')">🏢</button><button class="tbtn" onclick="setSuit()">🤵</button><button class="tbtn" onclick="setHair()">💇</button><button class="tbtn" onclick="removeBg()">✂️</button><button class="tbtn" onclick="downloadPhoto('jpg')">⬇️</button><button class="tbtn" onclick="downloadPhoto('png')">🖼️</button><button class="tbtn" onclick="closeModal('editModal')">✕</button></div></div></div>
<div id="cvModal" class="modal"><div class="box"><input id="cvName" class="inp" placeholder="Full Name"><input id="cvTitle" class="inp" placeholder="Title"><input id="cvPhone" class="inp" placeholder="Phone | Email | Location"><textarea id="cvSum" class="area" placeholder="Summary"></textarea><textarea id="cvExp" class="area" placeholder="Experience"></textarea><textarea id="cvTo" class="area" placeholder="To"></textarea><div class="tools"><button class="tbtn" style="background:#00f2ff;color:#000" onclick="genCV()">🤖</button><button class="tbtn" style="background:#00ff88;color:#000" onclick="downCV('pdf')">📄</button><button class="tbtn" onclick="downCV('txt')">📝</button><button class="tbtn" onclick="closeModal('cvModal')">✕</button></div><div id="cvOut" class="out"></div></div></div>
<div id="transModal" class="modal"><div class="box"><div style="display:flex;gap:6px"><select id="from" class="inp" style="flex:1"><option value="auto">Auto</option><option value="en">EN</option><option value="lg">LG</option><option value="sw">SW</option><option value="fr">FR</option><option value="ar">AR</option></select><select id="to" class="inp" style="flex:1"><option value="lg">LG</option><option value="sw">SW</option><option value="fr">FR</option><option value="ar">AR</option><option value="en">EN</option></select></div><textarea id="transIn" class="area" placeholder="Enter text..."></textarea><div class="tools"><button class="tbtn" style="background:#00f2ff;color:#000" onclick="doTrans()">🌍</button><button class="tbtn" onclick="swap()">⇄</button><button class="tbtn" style="background:red" onclick="closeModal('transModal')">✕</button><button class="tbtn" onclick="downTrans('txt')">📝</button><button class="tbtn" onclick="speakTrans()">🔊</button></div><div id="transOut" class="out"></div></div></div>
<div id="downModal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;margin:8px 0"><span>📄 CV</span><div style="display:flex;gap:6px"><button class="tbtn" onclick="downCV('pdf')">📄</button><button class="tbtn" onclick="downCV('txt')">📝</button></div></div><div style="display:flex;justify-content:space-between;margin:8px 0"><span>✏️ Photo</span><div style="display:flex;gap:6px"><button class="tbtn" onclick="downloadPhoto('jpg')">🖼️</button><button class="tbtn" onclick="downloadPhoto('png')">🌄</button></div></div><div style="display:flex;justify-content:space-between;margin:8px 0"><span>💬 Chat</span><div style="display:flex;gap:6px"><button class="tbtn" onclick="downChat('txt')">📝</button><button class="tbtn" onclick="downChat('pdf')">📄</button></div></div><div class="tools"><button class="tbtn" style="background:red" onclick="closeModal('downModal')">✕</button><button class="tbtn" style="background:#fff;color:#000" onclick="downloadApp()">📥</button></div></div></div>
<script>
const LOCKED_TITLE="Benvo Ultra 34 Ai"; document.title=LOCKED_TITLE;
setInterval(()=>{if(document.title!==LOCKED_TITLE)document.title=LOCKED_TITLE;let el=document.getElementById('lockedTitle');if(el&&el.textContent!==LOCKED_TITLE)el.textContent=LOCKED_TITLE;},200);
// 34 BRAINS HIDDEN - ALL KNOWLEDGE ACTIVE
const BRAINS_34=["greeting","date","mubende","museveni","bobi","uganda","capital","president","population","luganda","ai","cv","translate","photo","voice","chat","history","geography","politics","culture","business","education","health","tech","science","math","language","jobs","legal","travel","food","sports","music","news"];
const LANGS=[{c:'en',f:'🇬🇧',l:'en-US'},{c:'lg',f:'🇺🇬',l:'en-US'},{c:'sw',f:'🇹🇿',l:'sw-TZ'},{c:'fr',f:'🇫🇷',l:'fr-FR'},{c:'ar',f:'🇸🇦',l:'ar-SA'}];
let cur='en',rec=null,callOn=false,popOpen=false,langOpen=false;
let editImg=new Image(),bgMode='black',isSuit=false,isHair=false,segMask=null,seg=null;
let history=JSON.parse(localStorage.getItem('benvo34')||'[]');
if(history.length==0){history=[{r:'bot',t:'Hello! I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende Uganda.\nCreated by Katugunda Benon.\n34 Brains Active - Ask me anything: who is museveni, what is uganda, when is today, where is mubende'}];}
const chat=document.getElementById('chat'),input=document.getElementById('msgInput'),pop=document.getElementById('pop'),langPanel=document.getElementById('langPanel'),curFlag=document.getElementById('curFlag');
const bgCanvas=document.getElementById('bgCanvas'),editCanvas=document.getElementById('editCanvas'),bgCtx=bgCanvas.getContext('2d'),ctx=editCanvas.getContext('2d');
function renderLang(){langPanel.innerHTML='';LANGS.forEach(x=>{let b=document.createElement('button');b.className='lang'+(cur==x.c?' active':'');b.textContent=x.f;b.onclick=()=>{cur=x.c;curFlag.textContent=x.f;toggleLang();};langPanel.appendChild(b);});}renderLang();
function toggleLang(){langOpen=!langOpen;langPanel.classList.toggle('show',langOpen);}
function togglePop(){popOpen=!popOpen;pop.style.display=popOpen?'block':'none';}
function openModal(id){document.getElementById(id).style.display='block';}function closeModal(id){document.getElementById(id).style.display='none';}
function drawChat(){chat.innerHTML='';history.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.r=='user'?'user':'bot');d.textContent=m.t;if(m.img){let im=document.createElement('img');im.src=m.img;im.style.width='100%';im.style.borderRadius='8px';im.style.marginTop='6px';d.appendChild(im);}chat.appendChild(d);});chat.scrollTop=chat.scrollHeight;}drawChat();
function save(){localStorage.setItem('benvo34',JSON.stringify(history));}
function getAnswer(t){
 let q=t.toLowerCase().trim();
 let today=new Date(); let dateStr=today.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); let timeStr=today.toLocaleTimeString();
 if(q==='hi'||q==='hello'||q.startsWith('hi ')||q.startsWith('hello ')) return 'Hello! I am Benvo Ultra 34 Ai from Maaya Lubimbiri Kasambya Mubende Uganda. Created by Katugunda Benon. 34 Brains Active. How can I help?';
 if(q.includes('good morning')) return 'Good morning! 🌅 Blessed day from Kasambya Mubende Uganda. I am ready with 34 Brains to help you.';
 if(q.includes('when is today')||q.includes('today date')||q.includes('what is today')) return 'Today is '+dateStr+'\nTime: '+timeStr+'\nEAT UTC+3 - Kasambya Mubende Uganda - Benvo Ultra 34 Ai';
 if(q.includes('where is mubende')||q.includes('mubende district')) return 'Mubende District is in Central Uganda, 150km west of Kampala on Kampala-Fort Portal highway.\n• Kasambya town is in Mubende\n• Maaya Lubimbiri village in Kasambya\n• Agriculture, cattle, hills\n• Home of Benvo Ultra 34 Ai created by Katugunda Benon - From Dust to the World!';
 if(q.includes('who are you')||q.includes('your name')) return 'I am Benvo Ultra 34 Ai - Created by Katugunda Benon from Maaya Lubimbiri Kasambya Mubende Uganda.\n34 Brains:\n1-10 Chat, Greeting, Date, Geography, Politics, History\n11-20 CV, Letters, Translate (Luganda/Swahili/French/Arabic), Education, Jobs\n21-30 Photo AI (hotel/office/suit/hair/bg remove), Camera, Voice, Call\n31-34 Downloads (PDF/TXT), Speech\nI listen, assess and speak your language!';
 if(q.includes('museveni')) return 'Yoweri Kaguta Museveni is President of Uganda since 29 Jan 1986.\n• Born 15 Sep 1944 Ntungamo\n• Party: NRM - National Resistance Movement\n• Led NRA bush war 1981-1986\n• President 38+ years\n• Wife Janet Museveni, son Gen Muhoozi Kainerugaba\n• From Ankole cattle family\n• Restored stability after Amin/Obote\n• Capital Kampala, Pearl of Africa';
 if(q.includes('bobi wine')||q.includes('kyagulanyi')) return 'Bobi Wine real name Robert Kyagulanyi Ssentamu, born 12 Feb 1982 Mpigi, musician turned politician, leader of NUP National Unity Platform, People Power movement, MP Kyadondo East 2017-2020, main opposition 2021 vs Museveni.';
 if(q.includes('president of uganda')) return 'President of Uganda is Yoweri Kaguta Museveni since 29 Jan 1986. Vice President Jessica Alupo since 2021.';
 if(q.includes('capital of uganda')) return 'Capital of Uganda is Kampala, on Lake Victoria, ~1.7M city, 6M metro, largest city and economic capital.';
 if(q.includes('what is uganda')||q.includes('about uganda')) return 'Uganda is landlocked East Africa, Pearl of Africa by Churchill.\n• Capital Kampala\n• Pop ~48M (2024)\n• Languages English/Swahili official, Luganda widely spoken\n• Currency UGX Shilling\n• Borders Kenya Tanzania Rwanda DRC S.Sudan\n• Lake Victoria, Nile source, gorillas\n• Independence 9 Oct 1962 from UK';
 if(q.includes('population of uganda')) return 'Uganda population ~48-49 million as of 2024-2025, youngest population in world, growth ~3% yearly.';
 if(q.includes('what is ai')) return 'AI Artificial Intelligence is computer that thinks/learns like humans. Benvo Ultra 34 Ai uses 34 Brains to answer, write CVs, translate, edit photos. Created by Katugunda Benon Maaya Lubimbiri Kasambya Mubende.';
 if(q.includes('oli otya')) return 'Gyebale! Ndi bulungi! Nze Benvo Ultra 34 Ai okuva e Maaya Lubimbiri Kasambya Mubende. Nvuga Oluganda! Nkuyamba ntya?';
 if(q.includes('how are you')) return 'I am great! Thank you. I am Benvo Ultra 34 Ai with 34 Brains ready to help. How can I assist you?';
 return 'Q: '+t+'\n\nAs Benvo Ultra 34 Ai with 34 Brains from Maaya Lubimbiri Kasambya Mubende Uganda:\nI have knowledge about "'+t+'".\n\n'+(q.includes('who')?'This person is notable in Uganda/world. ':'')+(q.includes('what')?'This is important concept. ':'')+'Tell me more specific about "'+t+'" and I will explain fully with dates, background and details.\n\nFor tools: Tap ☰ > 📄 CV, ✏️ Photo, 🌍 Translate, 📥 Download.';
}
function reply(t){
 let answer=getAnswer(t);
 history.push({r:'bot',t:answer}); save(); drawChat();
 try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(answer);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}
}
document.getElementById('send').onclick=()=>{let t=input.value.trim();if(!t)return; history.push({r:'user',t:t}); save(); drawChat(); input.value=''; setTimeout(()=>reply(t),250);};
input.onkeydown=e=>{if(e.key=='Enter')document.getElementById('send').click();};
function openWithSrc(src){editImg.src=src;editImg.onload=()=>{let w=editImg.width,h=editImg.height,max=800;if(w>max){h=h*max/w;w=max;}bgCanvas.width=editCanvas.width=w;bgCanvas.height=editCanvas.height=h;bgMode='black';isSuit=false;isHair=false;drawScene();openModal('editModal');initSeg();};}
document.getElementById('file').onchange=e=>{for(let f of e.target.files){let r=new FileReader();r.onload=x=>{history.push({r:'user',t:'📁',img:x.target.result});save();drawChat();openWithSrc(x.target.result);};r.readAsDataURL(f);}};
function drawScene(){let w=bgCanvas.width,h=bgCanvas.height;bgCtx.clearRect(0,0,w,h);if(bgMode=='hotel'){let g=bgCtx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#4a2c0a');g.addColorStop(1,'#d9b18e');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h);}else if(bgMode=='office'){let g=bgCtx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a1931');g.addColorStop(1,'#1e90ff');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h);}else{bgCtx.fillStyle='#000';bgCtx.fillRect(0,0,w,h);}ctx.clearRect(0,0,w,h);let dw=editImg.width,dh=editImg.height,sc=Math.min(w/dw,h/dh);dw*=sc;dh*=sc;let x=(w-dw)/2,y=(h-dh)/2;if(segMask&&bgMode!='black'){ctx.drawImage(segMask,x,y,dw,dh);ctx.globalCompositeOperation='source-in';}ctx.drawImage(editImg,x,y,dw,dh);ctx.globalCompositeOperation='source-over';if(isSuit){ctx.fillStyle='#111';ctx.fillRect(x+dw*0.15,y+dh*0.55,dw*0.7,dh*0.45);}if(isHair){ctx.globalCompositeOperation='multiply';ctx.fillStyle='#ff69b4aa';ctx.fillRect(x+dw*0.15,y,dw*0.7,dh*0.35);ctx.globalCompositeOperation='source-over';}}
function initSeg(){try{let s=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});s.setOptions({modelSelection:1});s.onResults(r=>{segMask=r.segmentationMask;drawScene();});seg=s;seg.send({image:editImg});}catch(e){}}
function setBg(m){bgMode=m;drawScene();}function setSuit(){isSuit=!isSuit;drawScene();}function setHair(){isHair=!isHair;drawScene();}function removeBg(){bgMode='black';if(seg)seg.send({image:editImg});drawScene();}
function runCmd(){let c=document.getElementById('cmd').value.toLowerCase();if(c.includes('hotel'))setBg('hotel');if(c.includes('office'))setBg('office');if(c.includes('suit'))setSuit();if(c.includes('pink')||c.includes('hair'))setHair();if(c.includes('remove'))removeBg();}
function downloadPhoto(fmt){let fc=document.createElement('canvas');fc.width=bgCanvas.width;fc.height=bgCanvas.height;let fctx=fc.getContext('2d');fctx.drawImage(bgCanvas,0,0);fctx.drawImage(editCanvas,0,0);if(fmt=='jpg'){let a=document.createElement('a');a.download='Benvo-'+Date.now()+'.jpg';a.href=fc.toDataURL('image/jpeg',0.92);a.click();}if(fmt=='png'){let a=document.createElement('a');a.download='Benvo-'+Date.now()+'.png';a.href=fc.toDataURL('image/png');a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF({orientation:fc.width>fc.height?'l':'p',unit:'px',format:[fc.width,fc.height]});pdf.addImage(fc.toDataURL('image/jpeg',0.9),'JPEG',0,0,fc.width,fc.height);pdf.save('Benvo-'+Date.now()+'.pdf');}}
function openCam(){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{let v=document.createElement('video');v.srcObject=s;v.autoplay=true;v.style.width='100%';let b=document.createElement('div');b.className='box';b.appendChild(v);let btn=document.createElement('button');btn.className='tbtn';btn.textContent='📸';btn.style.background='#00f2ff';btn.onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg',0.9);history.push({r:'user',t:'📷',img:url});save();drawChat();s.getTracks().forEach(t=>t.stop());document.body.removeChild(wrap);openWithSrc(url);};b.appendChild(btn);let wrap=document.createElement('div');wrap.className='modal';wrap.style.display='block';wrap.appendChild(b);document.body.appendChild(wrap);}).catch(()=>{document.getElementById('file').click();});}
function genCV(){let n=document.getElementById('cvName').value||'Katugunda Benon';let t=document.getElementById('cvTitle').value||'Professional';let p=document.getElementById('cvPhone').value||'Kasambya Mubende';let s=document.getElementById('cvSum').value||'';let e=document.getElementById('cvExp').value||'';let to=document.getElementById('cvTo').value||'';document.getElementById('cvOut').textContent=n.toUpperCase()+'\n'+t+'\n'+p+'\n\n'+s+'\n\n'+e+'\n\nTo: '+to;}
function downCV(fmt){let txt=document.getElementById('cvOut').textContent;if(!txt){genCV();txt=document.getElementById('cvOut').textContent;}if(fmt=='txt'){let b=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-CV-'+Date.now()+'.txt';a.href=URL.createObjectURL(b);a.click();}if(fmt=='doc'){let b=new Blob([txt],{type:'application/msword'});let a=document.createElement('a');a.download='Benvo-CV-'+Date.now()+'.doc';a.href=URL.createObjectURL(b);a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(txt,180);pdf.text(lines,10,10);pdf.save('Benvo-CV-'+Date.now()+'.pdf');}}
function swap(){let a=document.getElementById('from').value,b=document.getElementById('to').value;document.getElementById('from').value=b;document.getElementById('to').value=a;}
async function doTrans(){let text=document.getElementById('transIn').value.trim();if(!text)return;let to=document.getElementById('to').value,from=document.getElementById('from').value,out=document.getElementById('transOut');out.textContent='...';try{let apiTo=to=='lg'?'sw':to,apiFrom=from=='lg'?'en':from;if(apiFrom=='auto')apiFrom='en';let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+apiFrom+'|'+apiTo;let r=await fetch(url);let d=await r.json();out.textContent=d.responseData.translatedText||text;}catch(e){out.textContent=text;}}
function downTrans(fmt){let txt=document.getElementById('transIn').value+' -> '+document.getElementById('transOut').textContent;if(fmt=='txt'){let b=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Trans-'+Date.now()+'.txt';a.href=URL.createObjectURL(b);a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(txt,180);pdf.text(lines,10,10);pdf.save('Benvo-Trans-'+Date.now()+'.pdf');}}
function speakTrans(){let t=document.getElementById('transOut').textContent;try{let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}catch(e){}}
function downChat(fmt){let all=history.map(m=>m.t).join('\n\n');if(fmt=='txt'){let b=new Blob([all],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Chat-'+Date.now()+'.txt';a.href=URL.createObjectURL(b);a.click();}if(fmt=='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(all,180);let y=10;for(let i=0;i<lines.length;i++){if(y>280){pdf.addPage();y=10;}pdf.text(lines[i],10,y);y+=6;}pdf.save('Benvo-Chat-'+Date.now()+'.pdf');}}
function downloadApp(){let h=document.documentElement.outerHTML;let b=new Blob([h],{type:'text/html'});let a=document.createElement('a');a.download='Benvo-Ultra-34-Ai-'+Date.now()+'.html';a.href=URL.createObjectURL(b);a.click();}
function listenNow(){try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(!rec){rec=new SR();rec.continuous=false;rec.interimResults=false;}rec.lang=LANGS.find(x=>x.c==cur)?.l||'en-US';rec.start();rec.onresult=e=>{let txt=e.results[0][0].transcript;history.push({r:'user',t:'🎤 '+txt});save();drawChat();reply(txt);};rec.onend=()=>{if(callOn)setTimeout(()=>{try{rec.start()}catch{}},800);};}catch(e){}}
function startCall(){callOn=true;listenNow();}
function clearChat(){if(confirm('Clear?')){history=[{r:'bot',t:'Hello! I am Benvo Ultra 34 Ai'}];save();drawChat();}}
document.addEventListener('click',e=>{if(!e.target.closest('#row')&&popOpen){popOpen=false;pop.style.display='none';}if(!e.target.closest('.top')&&langOpen){langOpen=false;langPanel.classList.remove('show');}});
</script>
</body></html>

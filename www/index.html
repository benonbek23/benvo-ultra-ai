<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Benvo Ultra 34 AI</title>
<link rel="icon" href="be-icon.png"><link rel="apple-touch-icon" href="be-icon.png"><meta name="theme-color" content="#0a1fff">
<style>body{background:#0a1931;color:#fff;font-family:Arial;margin:0;text-align:center}.top{padding:14px;border-bottom:2px solid #00f2ff44;display:flex;align-items:center;gap:12px;justify-content:center}.logo{width:48px;height:48px;border-radius:12px;box-shadow:0 0 12px #00f2ff66}.card{background:#112240;border:2px solid #00f2ff44;border-radius:14px;padding:10px;margin:10px auto;max-width:650px}#chat{height:40vh;overflow-y:auto;background:#0a1931;border-radius:10px;padding:8px;text-align:left;border:1px solid #00f2ff22}.msg{margin:6px;padding:10px;border-radius:14px;max-width:85%;font-size:13px;line-height:1.5}.user{background:#00f2ff;color:#000;margin-left:auto}.bot{background:#1e3a5f;border:1px solid #00f2ff22}.msg img{width:100%;border-radius:8px;margin-top:6px;cursor:pointer}#row{display:flex;gap:6px;align-items:center;margin-top:8px;position:relative}#msgInput{flex:1;padding:14px;border-radius:25px;border:1px solid #00f2ff33;background:#000;color:#fff}.iconTab{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#00f2ff,#00ff88);color:#000;font-size:20px;font-weight:900;cursor:pointer;flex-shrink:0}#sendBtn{width:48px;height:48px;border-radius:50%;border:none;background:#00f2ff;color:#000;font-weight:900;cursor:pointer;flex-shrink:0}#popMenu{display:none;position:absolute;bottom:60px;left:0;background:#0a1931;border:2px solid #00f2ff44;border-radius:14px;padding:8px;z-index:10;min-width:170px}.popItem{display:flex;gap:10px;width:100%;padding:12px;border:none;background:#112240;color:#fff;border-radius:10px;margin:4px 0;text-align:left;font-size:13px;cursor:pointer}#vidBox{display:none}#vidBox video{width:100%;border-radius:12px}#editModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000e;z-index:100;overflow-y:auto;padding:10px}#editBox{background:#112240;border:2px solid #00f2ff;border-radius:14px;padding:12px;margin:20px auto;max-width:600px}#editBox canvas{width:100%;border-radius:10px;background:#000}.toolRow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.toolBtn{padding:10px 12px;border-radius:20px;border:none;background:#1e3a5f;color:#fff;font-size:12px;font-weight:700;cursor:pointer;flex:1;min-width:70px}#docArea{width:100%;min-height:160px;background:#000;color:#fff;border:1px solid #00f2ff33;border-radius:10px;padding:10px;font-family:monospace}</style></head><body>
<div class="top"><img src="be-icon.png" class="logo" alt="BE"><div style="text-align:left"><h1 style="color:#00f2ff;margin:0;font-size:18px">Benvo Ultra 34 AI</h1><p style="color:#00ff88;font-size:10px;margin:2px 0">| Benon K | Maaya Lubimbiri Kasambya Mubende Uganda | From Dust to the World |</p></div></div>
<div class="card">
<div id="vidBox"><video id="v" autoplay playsinline></video><div style="display:flex;gap:6px;margin-top:6px"><button class="iconTab" style="flex:1;border-radius:10px;height:44px" onclick="snap()">📸 Take</button><button class="iconTab" style="flex:1;border-radius:10px;height:44px;background:red;color:#fff" onclick="closeCam()">✕</button></div></div>
<div id="chat"></div>
<div id="row"><button class="iconTab" onclick="toggleMenu()">☰</button><div id="popMenu"><button class="popItem" onclick="doCall();toggleMenu()">📞 CALL Infinite</button><button class="popItem" onclick="doCam();toggleMenu()">📷 CAMERA</button><button class="popItem" onclick="doUp();toggleMenu()">📁 UPLOAD Photo/Doc</button><button class="popItem" onclick="openEditor();toggleMenu()">✏️ EDITOR Photo & Doc</button><button class="popItem" onclick="clearChat();toggleMenu()">🗑️ Clear</button></div><input id="msgInput" placeholder="Type..."><button id="sendBtn">➤</button><input id="file" type="file" hidden accept="image/*,video/*,.pdf,.doc,.docx,.txt" multiple><input id="camFile" type="file" hidden accept="image/*" capture="environment"></div>
<div id="st" style="color:#00ff88;font-size:10px;margin-top:6px">🔵 BE Icon active — 34 Brains — Kasambya Mubende</div>
</div>
<div id="editModal"><div id="editBox"><h3 style="color:#00f2ff;margin:0 0 8px">✏️ BE Editor — Photo & Document</h3><canvas id="editCanvas"></canvas><div class="toolRow"><button class="toolBtn" onclick="applyFilter('none')">Original</button><button class="toolBtn" onclick="applyFilter('grayscale')">B&W</button><button class="toolBtn" onclick="applyFilter('sepia')">Sepia</button><button class="toolBtn" onclick="applyFilter('bright')">Bright+</button><button class="toolBtn" onclick="applyFilter('dark')">Dark</button></div><div class="toolRow"><button class="toolBtn" onclick="rotateImg(90)">↻ 90°</button><button class="toolBtn" onclick="rotateImg(-90)">↺ -90°</button><button class="toolBtn" onclick="flipImg('h')">⇔ Flip</button><button class="toolBtn" onclick="flipImg('v')">⇕ Flip</button></div><div class="toolRow"><label style="font-size:11px;width:100%;text-align:left">Brightness: <input type="range" id="brightRange" min="-100" max="100" value="0" style="width:70%" oninput="updateEdit()"></label><label style="font-size:11px;width:100%;text-align:left">Contrast: <input type="range" id="contrastRange" min="-100" max="100" value="0" style="width:70%" oninput="updateEdit()"></label></div><textarea id="docArea" placeholder="Doc text editable here..."></textarea><div class="toolRow"><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadEdited()">⬇️ Photo</button><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadDoc()">⬇️ Doc</button><button class="toolBtn" style="background:#8a2be2;color:#fff" onclick="sendEditedToChat()">💬 Send</button><button class="toolBtn" style="background:red;color:#fff" onclick="closeEditor()">✕ Close</button></div></div></div>
<script>
const INTRO="Hello! I'm Benvo Ultra 34 Ai - Based in Kasambya Mubende created by Katugunda Benon basing from Maaya - Lubimbiri Kasambya - Mubende Uganda,\n\nAm here to Assist you!\nHow can I help you today?";
let h=JSON.parse(localStorage.getItem('b34')||'[]');if(h.length===0){h=[{r:'b',t:INTRO}];localStorage.setItem('b34',JSON.stringify(h));}
let rec,stream=null,callOn=false,menuOpen=false,editImg=new Image(),editRot=0,flipH=false,flipV=false,curFilter='none';
const chat=document.getElementById('chat'),inp=document.getElementById('msgInput'),st=document.getElementById('st'),v=document.getElementById('v'),vidBox=document.getElementById('vidBox'),pop=document.getElementById('popMenu'),editModal=document.getElementById('editModal'),editCanvas=document.getElementById('editCanvas'),ctx=editCanvas.getContext('2d'),docArea=document.getElementById('docArea');
function draw(){chat.innerHTML='';h.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.r==='u'?'user':'bot');d.innerText=m.t;if(m.img){let im=document.createElement('img');im.src=m.img;im.onclick=()=>openEditorWithImg(m.img);d.appendChild(im);}chat.appendChild(d)});chat.scrollTop=99999}draw();
function save(){localStorage.setItem('b34',JSON.stringify(h))}
function reply(t){let r="Benvo Ultra 34 AI — By Katugunda Benon Maaya Lubimbiri: '"+t+"' — BE Icon Ready!";h.push({r:'b',t:r});save();draw();let u=new SpeechSynthesisUtterance(r);u.onstart=()=>{try{rec.stop()}catch{}};u.onend=()=>{if(callOn)restart();};speechSynthesis.speak(u);}
function send(){let t=inp.value.trim();if(!t)return;h.push({r:'u',t:t});save();draw();inp.value='';st.innerText='BE 34 Brains thinking...';setTimeout(()=>reply(t),400);fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}).then(r=>r.json()).then(d=>{if(d.reply){h[h.length-1]={r:'b',t:d.reply};save();draw();}}).catch(()=>{});}
function toggleMenu(){menuOpen=!menuOpen;pop.style.display=menuOpen?'block':'none';}
document.getElementById('sendBtn').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};
function doUp(){document.getElementById('file').click();}
document.getElementById('file').onchange=e=>{for(let f of e.target.files){if(f.type.startsWith('image/')){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📁 Photo: '+f.name,img:x.target.result});save();draw();reply('Photo '+f.name+' uploaded');openEditorWithImg(x.target.result);};rd.readAsDataURL(f);}else{let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📄 Doc: '+f.name});save();draw();docArea.value=x.target.result.slice(0,5000);openEditor();reply('Doc '+f.name+' ready');};rd.readAsText(f);}}};
document.getElementById('camFile').onchange=e=>{for(let f of e.target.files){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📷 Camera',img:x.target.result});save();draw();openEditorWithImg(x.target.result);reply('Camera photo');};rd.readAsDataURL(f);}};
async function openCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;vidBox.style.display='block';}catch{document.getElementById('camFile').click();}} function doCam(){openCam();}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());vidBox.style.display='none';}
function snap(){let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg',0.85);h.push({r:'u',t:'📷 Photo taken',img:url});save();draw();closeCam();openEditorWithImg(url);reply('Photo captured');}
function openEditorWithImg(src){editImg.src=src;editImg.onload=()=>{editCanvas.width=editImg.width;editCanvas.height=editImg.height;editRot=0;flipH=false;flipV=false;curFilter='none';document.getElementById('brightRange').value=0;document.getElementById('contrastRange').value=0;updateEdit();editModal.style.display='block';};}
function openEditor(){if(!editImg.src){editCanvas.width=600;editCanvas.height=400;ctx.fillStyle='#000';ctx.fillRect(0,0,600,400);ctx.fillStyle='#00f2ff';ctx.font='16px Arial';ctx.fillText('Upload photo to edit',20,200);}editModal.style.display='block';}
function closeEditor(){editModal.style.display='none';}
function applyFilter(f){curFilter=f;updateEdit();}
function rotateImg(d){editRot=(editRot+d)%360;updateEdit();}
function flipImg(dir){if(dir==='h')flipH=!flipH;else flipV=!flipV;updateEdit();}
function updateEdit(){if(!editImg.src||!editImg.complete)return;let w=editCanvas.width,h2=editCanvas.height;ctx.save();ctx.clearRect(0,0,w,h2);ctx.translate(w/2,h2/2);ctx.rotate(editRot*Math.PI/180);ctx.scale(flipH?-1:1,flipV?-1:1);let br=document.getElementById('brightRange').value,co=document.getElementById('contrastRange').value;let filterStr='';if(curFilter==='grayscale')filterStr='grayscale(100%) ';if(curFilter==='sepia')filterStr='sepia(100%) ';if(curFilter==='bright')filterStr='brightness(150%) ';if(curFilter==='dark')filterStr='brightness(60%) ';filterStr+=`brightness(${100+parseInt(br)}%) contrast(${100+parseInt(co)}%)`;ctx.filter=filterStr;ctx.drawImage(editImg,-editImg.width/2,-editImg.height/2);ctx.restore();}
function downloadEdited(){let a=document.createElement('a');a.download='benvo-be-edited-'+Date.now()+'.jpg';a.href=editCanvas.toDataURL('image/jpeg',0.9);a.click();}
function downloadDoc(){let blob=new Blob([docArea.value],{type:'text/plain'});let a=document.createElement('a');a.download='benvo-doc-'+Date.now()+'.txt';a.href=URL.createObjectURL(blob);a.click();}
function sendEditedToChat(){let url=editCanvas.toDataURL('image/jpeg',0.85);h.push({r:'u',t:'✏️ Edited with BE',img:url});save();draw();closeEditor();reply('Edited saved');}
function clearChat(){if(confirm('Clear?')){h=[{r:'b',t:INTRO}];save();draw();}}
function restart(){if(!callOn)return;setTimeout(()=>{try{rec.start()}catch{setTimeout(restart,500)}},700);}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let tm;rec.onresult=e=>{clearTimeout(tm);let f='',j='';for(let k=0;k<e.results.length;k++){if(e.results[k].isFinal)f+=e.results[k][0].transcript+' ';else j+=e.results[k][0].transcript;}inp.value=f+j;tm=setTimeout(()=>{let s=(f||j).trim();if(s.length>1){try{rec.stop()}catch{}let t=inp.value;inp.value='';h.push({r:'u',t:t});save();draw();reply(t);}},1400);};rec.onend=()=>{if(callOn&&!speechSynthesis.speaking)restart();};}
function doCall(){callOn?stopCall():startCall();}
async function startCall(){try{await navigator.mediaDevices.getUserMedia({audio:true});}catch{alert('Allow mic');return;}callOn=true;st.innerText='🎤 CALL ON';try{rec.start()}catch{restart();}} function stopCall(){callOn=false;try{rec.stop()}catch{}speechSynthesis.cancel();st.innerText='Call ended';}
document.addEventListener('click',e=>{if(!e.target.closest('#row')&&menuOpen)toggleMenu();});
</script></body></html>

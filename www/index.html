<style>
*{box-sizing:border-box}body{background:#0a1931;color:#fff;font-family:Arial;margin:0;overflow-x:hidden}
.top{padding:10px 12px;border-bottom:2px solid #00f2ff44;display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#0a1931;z-index:5}

.topInfo{flex:1;min-width:0;text-align:left}.topInfo h1{color:#00f2ff;margin:0;font-size:17px}.topInfo p{color:#00ff88;font-size:8px;margin:2px 0}
.langToggle{width:42px;height:42px;border-radius:50%;border:1px solid #00f2ff66;background:#112240;color:#fff;font-size:16px;cursor:pointer}
.langPanel{display:none;position:absolute;top:60px;left:0;right:0;background:#0a1931;border-bottom:2px solid #00f2ff44;padding:10px;z-index:6;flex-wrap:wrap;gap:6px}.langPanel.show{display:flex}
.langChip{width:42px;height:42px;border-radius:50%;border:1px solid #00f2ff44;background:#112240;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}.langChip.active{background:#00f2ff;color:#000}
.card{background:#112240;border:2px solid #00f2ff44;border-radius:14px;padding:8px;margin:6px auto;width:100%}@media(min-width:640px){.card{max-width:700px}}

.msg{margin:8px 0;padding:12px 14px;border-radius:18px;max-width:92%;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.user{background:#00f2ff;color:#000;margin-left:auto}.bot{background:#1e3a5f}
.assessBox{background:#001122;border:1px solid #00f2ff33;border-radius:10px;padding:8px;margin:6px 0;text-align:left;font-size:11px;display:none}
#row{display:flex;gap:6px;align-items:center;margin-top:10px;position:relative}
#msgInput{flex:1;padding:15px 18px;border-radius:28px;border:1px solid #00f2ff33;background:#000;color:#fff;font-size:16px;min-width:0;outline:none}
.iconTab{width:46px;height:46px;min-width:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#00f2ff,#00ff88);color:#000;font-size:18px;font-weight:900;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

.popItem{width:46px;height:46px;border:none;background:#112240;color:#fff;border-radius:50%;margin:6px 0;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#vidBox{display:none}#vidBox video{width:100%;border-radius:12px}
#editModal,#cvModal,#transModal,#downModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000f;z-index:100;overflow-y:auto;padding:8px}
#editBox,#cvBox,#transBox,#downBox{background:#0f1f3f;border:2px solid #00f2ff;border-radius:14px;padding:12px;margin:8px auto;max-width:98%;width:98%}
#canWrap{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden}#editCanvas,#bgCanvas{width:100%;display:block}
.toolRow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.toolBtn{width:46px;height:46px;border-radius:50%;border:none;background:#1e3a5f;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cvInput{width:100%;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
.cvTextarea{width:100%;min-height:85px;padding:11px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;margin:4px 0;font-size:13px}
#cvOutput,#transOutput{width:100%;min-height:110px;background:#fff;color:#000;border-radius:10px;padding:14px;font-size:12.5px;white-space:pre-wrap;text-align:left}
.transSelect{padding:10px;border-radius:10px;border:1px solid #00f2ff33;background:#000;color:#fff;font-size:13px;flex:1}
.downItem{display:flex;gap:8px;align-items:center;background:#112240;border:1px solid #00f2ff22;border-radius:30px;padding:8px 10px;margin:6px 0}
.micPulse{animation:pulse 1s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #00f2ff88}70%{box-shadow:0 0 0 12px #00f2ff00}100%{box-shadow:0 0 0 0 #00f2ff00}}
.footer{padding:8px;text-align:center;font-size:11px;color:#00ff88;letter-spacing:0.5px}
</style></head><body>

<div id="editModal"><div id="editBox"><div id="canWrap"><canvas id="bgCanvas"></canvas><canvas id="editCanvas" style="position:absolute;top:0;left:0"></canvas></div><div style="display:flex;gap:6px;margin:8px 0"><input id="cmdInput" style="flex:1;padding:12px;border-radius:20px;border:1px solid #00f2ff66;background:#000;color:#fff"><button class="toolBtn" style="background:#00ff88;color:#000" onclick="runCommand()">▶️</button></div><div class="toolRow"><button class="toolBtn" onclick="setBg('hotel')">🏨</button><button class="toolBtn" onclick="setBg('office')">🏢</button><button class="toolBtn" onclick="applyFilter('suit')">🤵</button><button class="toolBtn" onclick="applyHair('pink')">💇</button><button class="toolBtn" onclick="removeBgAI()" style="background:#00ff88;color:#000">✂️</button><button class="toolBtn" onclick="downloadEdited('jpg')">⬇️</button><button class="toolBtn" onclick="downloadEdited('png')">🖼️</button><button class="toolBtn" onclick="downloadEdited('pdf')">📄</button><button class="toolBtn" onclick="sendEditedToChat()">💬</button><button class="toolBtn" style="background:#ff4444;color:#fff" onclick="closeEditor()">✕</button></div></div></div>

<div id="cvModal"><div id="cvBox"><input id="cvName" class="cvInput" placeholder="..."><input id="cvTitleInput" class="cvInput" placeholder="..."><input id="cvPhone" class="cvInput" placeholder="..."><textarea id="cvSummary" class="cvTextarea" placeholder="..."></textarea><textarea id="cvExp" class="cvTextarea" placeholder="..."></textarea><textarea id="cvLetterTo" class="cvTextarea" placeholder="..."></textarea><div class="toolRow"><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="generateCV()">🤖</button><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadCV('pdf')">📄</button><button class="toolBtn" onclick="downloadCV('doc')">📃</button><button class="toolBtn" onclick="downloadCV('txt')">📝</button><button class="toolBtn" onclick="sendCVToChat()">💬</button><button class="toolBtn" style="background:#ff4444;color:#fff" onclick="closeCV()">✕</button></div><div id="cvOutput"></div></div></div>

<div id="transModal"><div id="transBox"><div style="display:flex;gap:6px"><select id="fromLang" class="transSelect"><option value="auto">🌍</option><option value="en">🇬🇧</option><option value="lg">🇺🇬</option><option value="sw">🇹🇿</option><option value="fr">🇫🇷</option><option value="ar">🇸🇦</option></select><select id="toLang" class="transSelect"><option value="lg">🇺🇬</option><option value="sw">🇹🇿</option><option value="fr">🇫🇷</option><option value="ar">🇸🇦</option><option value="en">🇬🇧</option><option value="es">🇪🇸</option></select></div><textarea id="transInput" class="cvTextarea" placeholder="..."></textarea><div class="toolRow"><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="doTranslate()">🌍</button><button class="toolBtn" onclick="swapLang()">⇄</button><button class="toolBtn" style="background:#ff4444;color:#fff" onclick="closeTrans()">✕</button></div><div id="transOutput"></div><div class="toolRow"><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadTrans('txt')">📝</button><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadTrans('pdf')">📄</button><button class="toolBtn" onclick="sendTransToChat()">💬</button><button class="toolBtn" onclick="speakTrans()">🔊</button></div></div></div>

<div id="downModal"><div id="downBox"><div class="downItem"><div style="flex:1">📄</div><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadCV('pdf')">📄</button><button class="toolBtn" onclick="downloadCV('doc')">📃</button><button class="toolBtn" onclick="downloadCV('txt')">📝</button></div><div class="downItem"><div style="flex:1">✉️</div><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadSpecific('formal','pdf')">📄</button><button class="toolBtn" onclick="downloadSpecific('formal','txt')">📝</button></div><div class="downItem"><div style="flex:1">✏️</div><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadEdited('jpg')">🖼️</button><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadEdited('png')">🌄</button><button class="toolBtn" style="background:#8a2be2;color:#fff" onclick="downloadEdited('pdf')">📄</button></div><div class="downItem"><div style="flex:1">🌍</div><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadTrans('txt')">📝</button><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadTrans('pdf')">📄</button></div><div class="downItem"><div style="flex:1">💬</div><button class="toolBtn" style="background:#00ff88;color:#000" onclick="downloadChat('txt')">📝</button><button class="toolBtn" style="background:#00f2ff;color:#000" onclick="downloadChat('pdf')">📄</button><button class="toolBtn" style="background:#8a2be2;color:#fff" onclick="downloadChat('json')">🔗</button></div><div class="downItem"><div style="flex:1">📱</div><button class="toolBtn" style="background:#fff;color:#000" onclick="downloadApp()">📥</button></div><div class="toolRow"><button class="toolBtn" style="background:#ff4444;color:#fff" onclick="closeDown()">✕</button><button class="toolBtn" style="background:#00ff88;color:#000;width:60px;height:60px;font-size:22px" onclick="downloadAllFiles()">📥</button></div></div></div>

<script>
const LANGS=[{code:'en',name:'English',flag:'🇬🇧',locale:'en-US'},{code:'lg',name:'Luganda',flag:'🇺🇬',locale:'en-US'},{code:'sw',name:'Kiswahili',flag:'🇹🇿',locale:'sw-TZ'},{code:'fr',name:'Français',flag:'🇫🇷',locale:'fr-FR'},{code:'ar',name:'العربية',flag:'🇸🇦',locale:'ar-SA'},{code:'es',name:'Español',flag:'🇪🇸',locale:'es-ES'}];
let currentLang='en';
function detectLangDetailed(t){let low=t.toLowerCase();let s={lg:0,sw:0,fr:0,ar:0,en:0};if(/[\u0600-\u06FF]/.test(t))s.ar+=50;if(low.match(/\b(oli otya|ki kati|weebale|nkwagala|wasuze|gyebale|mukwano|bulungi)\b/))s.lg+=40;if(low.match(/\b(habari|asante|nakupenda|karibu|sawa)\b/))s.sw+=40;if(low.match(/\b(bonjour|merci|comment|ça va)\b/))s.fr+=40;let max=0,det='en';for(let k in s){if(s[k]>max){max=s[k];det=k;}}return {lang:det,confidence:max>0?95:70};}
const INTRO="Welcome to Benvo Ultra 34 AI";
let h=JSON.parse(localStorage.getItem('b34')||'[]');if(h.length===0){h=[{r:'b',t:INTRO}];localStorage.setItem('b34',JSON.stringify(h));}
let rec,stream=null,callOn=false,menuOpen=false,langOpen=false,editImg=new Image(),editRot=0,flip=false,curFilter='none',bgMode='transparent',hairColor=null,segmentation=null,segMask=null,cvMode='cv';
const chat=document.getElementById('chat'),inp=document.getElementById('msgInput'),v=document.getElementById('v'),vidBox=document.getElementById('vidBox'),pop=document.getElementById('popMenu'),editModal=document.getElementById('editModal'),cvModal=document.getElementById('cvModal'),transModal=document.getElementById('transModal'),downModal=document.getElementById('downModal'),editCanvas=document.getElementById('editCanvas'),bgCanvas=document.getElementById('bgCanvas'),ctx=editCanvas.getContext('2d'),bgCtx=bgCanvas.getContext('2d'),cmdInput=document.getElementById('cmdInput'),cvOutput=document.getElementById('cvOutput'),transInput=document.getElementById('transInput'),transOutput=document.getElementById('transOutput'),fromLang=document.getElementById('fromLang'),toLang=document.getElementById('toLang'),langPanel=document.getElementById('langPanel'),curLangLabel=document.getElementById('curLangLabel'),assessBox=document.getElementById('assessBox'),heardText=document.getElementById('heardText'),assessedLang=document.getElementById('assessedLang'),speakLang=document.getElementById('speakLang'),confBar=document.getElementById('confBar'),listenLabel=document.getElementById('listenLabel'),micBtn=document.getElementById('micBtn');
function renderLangPanel(){langPanel.innerHTML='';LANGS.forEach(l=>{let b=document.createElement('button');b.className='langChip'+(currentLang===l.code?' active':'');b.innerText=l.flag;b.onclick=()=>{currentLang=l.code;curLangLabel.innerText=l.flag;renderLangPanel();toggleLang();};langPanel.appendChild(b);});}renderLangPanel();
function toggleLang(){langOpen=!langOpen;langPanel.classList.toggle('show',langOpen);}
function draw(){chat.innerHTML='';h.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.r==='u'?'user':'bot');d.innerText=m.t;if(m.img){let im=document.createElement('img');im.src=m.img;d.appendChild(im);}chat.appendChild(d)});chat.scrollTop=99999}draw();
function save(){localStorage.setItem('b34',JSON.stringify(h))}
function speakText(text,langCode){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);let info=LANGS.find(l=>l.code===langCode)||LANGS[0];u.lang=info.locale;u.rate=0.9;speechSynthesis.speak(u);}
async function reply(t){let assess=detectLangDetailed(t);currentLang=assess.lang;assessBox.style.display='block';heardText.innerText='"'+t.slice(0,30)+'"';assessedLang.innerText=assess.lang.toUpperCase()+' '+assess.confidence+'%';speakLang.innerText=LANGS.find(l=>l.code===assess.lang)?.flag||'';confBar.style.width=assess.confidence+'%';curLangLabel.innerText=LANGS.find(l=>l.code===assess.lang)?.flag||'🇬🇧';renderLangPanel();let baseReply=t;h.push({r:'b',t:baseReply});save();draw();speakText(baseReply,assess.lang);}
function send(){let t=inp.value.trim();if(!t)return;h.push({r:'u',t:t});save();draw();inp.value='';setTimeout(()=>reply(t),200);}
function toggleMenu(){menuOpen=!menuOpen;pop.style.display=menuOpen?'block':'none';}
document.getElementById('sendBtn').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};
function doUp(){document.getElementById('file').click();}
document.getElementById('file').onchange=e=>{for(let f of e.target.files){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📁',img:x.target.result});save();draw();openEditorWithImg(x.target.result);};rd.readAsDataURL(f);}};
document.getElementById('camFile').onchange=e=>{for(let f of e.target.files){let rd=new FileReader();rd.onload=x=>{h.push({r:'u',t:'📷',img:x.target.result});save();draw();openEditorWithImg(x.target.result);};rd.readAsDataURL(f);}};
async function openCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;vidBox.style.display='block';}catch{document.getElementById('camFile').click();}} function doCam(){openCam();}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());vidBox.style.display='none';}
function snap(){let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg',0.9);h.push({r:'u',t:'📷',img:url});save();draw();closeCam();openEditorWithImg(url);}
function openEditorWithImg(src){editImg.src=src;editImg.onload=()=>{let w=editImg.width,h2=editImg.height;let maxW=800;if(w>maxW){h2=h2*maxW/w;w=maxW;}editCanvas.width=bgCanvas.width=w;editCanvas.height=bgCanvas.height=h2;drawScene();editModal.style.display='block';initSegmentation();};}
function openEditor(){if(!editImg.src){editCanvas.width=bgCanvas.width=600;editCanvas.height=bgCanvas.height=400;bgCtx.fillStyle='#000';bgCtx.fillRect(0,0,600,400);}editModal.style.display='block';}
function closeEditor(){editModal.style.display='none';}
function initSegmentation(){try{const seg=new SelfieSegmentation({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});seg.setOptions({modelSelection:1});seg.onResults((res)=>{segMask=res.segmentationMask;drawScene();});segmentation=seg;segmentation.send({image:editImg});}catch(e){}}
function drawScene(){let w=editCanvas.width,h2=editCanvas.height;bgCtx.clearRect(0,0,w,h2);if(bgMode==='transparent'){bgCtx.fillStyle='#000';bgCtx.fillRect(0,0,w,h2);}else if(bgMode==='hotel'){let g=bgCtx.createLinearGradient(0,0,0,h2);g.addColorStop(0,'#4a2c0a');g.addColorStop(1,'#d9b18e');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h2);}else if(bgMode==='office'){let g=bgCtx.createLinearGradient(0,0,0,h2);g.addColorStop(0,'#0a1931');g.addColorStop(1,'#1e90ff');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h2);}else if(bgMode==='beach'){let g=bgCtx.createLinearGradient(0,0,0,h2);g.addColorStop(0,'#87CEEB');g.addColorStop(1,'#FFD700');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h2);}else if(bgMode==='white'){bgCtx.fillStyle='#fff';bgCtx.fillRect(0,0,w,h2);}else if(bgMode==='suit'){bgCtx.fillStyle='#111';bgCtx.fillRect(0,0,w,h2);}
ctx.clearRect(0,0,w,h2);ctx.save();ctx.translate(w/2,h2/2);ctx.rotate(editRot*Math.PI/180);ctx.scale(flip?-1:1,1);let dw=editImg.width,dh=editImg.height;let sc=Math.min(w/dw,h2/dh);dw*=sc;dh*=sc;let x=-dw/2,y=-dh/2;if(segMask&&bgMode!=='transparent'){ctx.drawImage(segMask,x,y,dw,dh);ctx.globalCompositeOperation='source-in';}ctx.drawImage(editImg,x,y,dw,dh);ctx.globalCompositeOperation='source-over';if(curFilter==='suit'||bgMode==='suit'){ctx.fillStyle='#0a0a0a';let sy=y+dh*0.55;let sh=dh*0.45;ctx.fillRect(x+dw*0.15,sy,dw*0.7,sh);}if(hairColor){ctx.globalCompositeOperation='multiply';ctx.fillStyle=hairColor==='pink'?'#ff69b4aa':'#ffd700aa';ctx.fillRect(x+dw*0.15,y,dw*0.7,dh*0.35);ctx.globalCompositeOperation='source-over';}ctx.restore();}
function setBg(m){bgMode=m;drawScene();}
function applyFilter(f){curFilter=f;drawScene();}
function applyHair(c){hairColor=c;drawScene();}
function removeBgAI(){bgMode='transparent';if(segmentation)segmentation.send({image:editImg});drawScene();}
function runCommand(){let cmd=cmdInput.value.toLowerCase();if(cmd.includes('hotel'))setBg('hotel');if(cmd.includes('office'))setBg('office');if(cmd.includes('beach'))setBg('beach');if(cmd.includes('suit'))applyFilter('suit');if(cmd.includes('pink'))applyHair('pink');if(cmd.includes('blonde'))applyHair('blonde');if(cmd.includes('remove'))removeBgAI();}
function downloadEdited(fmt){let fc=document.createElement('canvas');fc.width=bgCanvas.width;fc.height=bgCanvas.height;let fCtx=fc.getContext('2d');fCtx.drawImage(bgCanvas,0,0);fCtx.drawImage(editCanvas,0,0);if(fmt==='jpg'){let a=document.createElement('a');a.download='Benvo-Photo-'+Date.now()+'.jpg';a.href=fc.toDataURL('image/jpeg',0.92);a.click();}else if(fmt==='png'){let a=document.createElement('a');a.download='Benvo-Photo-'+Date.now()+'.png';a.href=fc.toDataURL('image/png');a.click();}else if(fmt==='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF({orientation:fc.width>fc.height?'landscape':'portrait',unit:'px',format:[fc.width,fc.height]});pdf.addImage(fc.toDataURL('image/jpeg',0.9),'JPEG',0,0,fc.width,fc.height);pdf.save('Benvo-Photo-'+Date.now()+'.pdf');}}
function sendEditedToChat(){let fc=document.createElement('canvas');fc.width=bgCanvas.width;fc.height=bgCanvas.height;let fCtx=fc.getContext('2d');fCtx.drawImage(bgCanvas,0,0);fCtx.drawImage(editCanvas,0,0);let url=fc.toDataURL('image/jpeg',0.85);h.push({r:'u',t:'✏️',img:url});save();draw();closeEditor();}
function openCV(mode){cvMode=mode;cvModal.style.display='block';}
function closeCV(){cvModal.style.display='none';}
function generateCV(){let name=document.getElementById('cvName').value||'Katugunda Benon';let title=document.getElementById('cvTitleInput').value||'Professional';let contact=document.getElementById('cvPhone').value||'Kasambya';let summary=document.getElementById('cvSummary').value||'';let exp=document.getElementById('cvExp').value||'';let to=document.getElementById('cvLetterTo').value||'';let txt=`${name}\n${title}\n${contact}\n\n${summary}\n\n${exp}\n\n${to}`;document.getElementById('cvOutput').innerText=txt;}
function downloadCV(fmt){let txt=document.getElementById('cvOutput').innerText;if(!txt){generateCV();txt=document.getElementById('cvOutput').innerText;}if(fmt==='txt'){let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-'+Date.now()+'.txt';a.href=URL.createObjectURL(blob);a.click();}else if(fmt==='doc'){let blob=new Blob([txt],{type:'application/msword'});let a=document.createElement('a');a.download='Benvo-'+Date.now()+'.doc';a.href=URL.createObjectURL(blob);a.click();}else if(fmt==='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(txt,180);pdf.text(lines,10,10);pdf.save('Benvo-'+Date.now()+'.pdf');}}
function downloadSpecific(mode,fmt){cvMode=mode;generateCV();downloadCV(fmt);}
function sendCVToChat(){let txt=document.getElementById('cvOutput').innerText;if(!txt){generateCV();txt=document.getElementById('cvOutput').innerText;}h.push({r:'b',t:txt});save();draw();closeCV();}
function openTrans(){transModal.style.display='block';}
function closeTrans(){transModal.style.display='none';}
function swapLang(){let a=fromLang.value,b=toLang.value;fromLang.value=b;toLang.value=a;}
async function doTranslate(){let text=transInput.value.trim();if(!text)return;transOutput.innerText='...';try{let apiTo=toLang.value==='lg'?'sw':toLang.value;let apiFrom=fromLang.value==='lg'?'en':fromLang.value;if(apiFrom==='auto')apiFrom='en';let url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${apiFrom}|${apiTo}`;let r=await fetch(url);let d=await r.json();transOutput.innerText=d.responseData.translatedText||text;}catch(e){transOutput.innerText=text;}}
function downloadTrans(fmt){let txt=`${transInput.value} -> ${transOutput.innerText}`;if(fmt==='txt'){let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Translate-'+Date.now()+'.txt';a.href=URL.createObjectURL(blob);a.click();}else if(fmt==='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(txt,180);pdf.text(lines,10,10);pdf.save('Benvo-Translate-'+Date.now()+'.pdf');}}
function sendTransToChat(){let txt=`${fromLang.value}→${toLang.value}: ${transInput.value} → ${transOutput.innerText}`;h.push({r:'b',t:txt});save();draw();closeTrans();}
function speakTrans(){speakText(transOutput.innerText,toLang.value);}
function openDown(){downModal.style.display='block';}
function closeDown(){downModal.style.display='none';}
function downloadChat(fmt){let all=h.map(m=>`${m.r==='u'?'USER':'BENVO'}: ${m.t}`).join('\n\n');if(fmt==='txt'){let blob=new Blob([all],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-Chat-'+Date.now()+'.txt';a.href=URL.createObjectURL(blob);a.click();}else if(fmt==='json'){let blob=new Blob([JSON.stringify(h,null,2)],{type:'application/json'});let a=document.createElement('a');a.download='Benvo-Chat-'+Date.now()+'.json';a.href=URL.createObjectURL(blob);a.click();}else if(fmt==='pdf'){let {jsPDF}=window.jspdf;let pdf=new jsPDF();let lines=pdf.splitTextToSize(all,180);let y=10;for(let i=0;i<lines.length;i++){if(y>280){pdf.addPage();y=10;}pdf.text(lines[i],10,y);y+=6;}pdf.save('Benvo-Chat-'+Date.now()+'.pdf');}}
function downloadApp(){let html=document.documentElement.outerHTML;let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.download='Benvo-App-'+Date.now()+'.html';a.href=URL.createObjectURL(blob);a.click();}
function downloadAllFiles(){let cv=document.getElementById('cvOutput').innerText||'';let trans=`${transInput.value} -> ${transOutput.innerText}`;let chatTxt=h.map(m=>`${m.r==='u'?'USER':'BENVO'}: ${m.t}`).join('\n\n');let combined=`${cv}\n\n${trans}\n\n${chatTxt}`;let blob=new Blob([combined],{type:'text/plain'});let a=document.createElement('a');a.download='Benvo-All-'+Date.now()+'.txt';a.href=URL.createObjectURL(blob);a.click();}
function clearChat(){if(confirm('?')){h=[{r:'b',t:INTRO}];save();draw();}}
function startListenAssess(){
 assessBox.style.display='block';heardText.innerText='...';assessedLang.innerText='...';micBtn.classList.add('micPulse');listenLabel.innerText='👂';
 try{
  if(!rec){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){return;}rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='en-US';}
  rec.lang=LANGS.find(l=>l.code===currentLang)?.locale||'en-US';if(currentLang==='lg')rec.lang='en-US';
  rec.start();
  rec.onresult=(e)=>{let final='',interim='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript+' ';}let txt=(final||interim).trim();if(!txt)return;heardText.innerText='"'+txt+'"';let assess=detectLangDetailed(txt);assessedLang.innerText=assess.lang.toUpperCase();speakLang.innerText=LANGS.find(l=>l.code===assess.lang)?.flag||'';confBar.style.width=assess.confidence+'%';curLangLabel.innerText=LANGS.find(l=>l.code===assess.lang)?.flag||'🇬🇧';document.getElementById('msgInput').value=txt;if(e.results[e.results.length-1].isFinal){setTimeout(()=>{micBtn.classList.remove('micPulse');let t=txt;h.push({r:'u',t:'🎤 '+t});save();draw();reply(t);},600);}};
  rec.onend=()=>{micBtn.classList.remove('micPulse');if(callOn)setTimeout(()=>{try{rec.start()}catch{}},800);else listenLabel.innerText='🎤';};
 }catch(err){micBtn.classList.remove('micPulse');}
}
function doCall(){callOn?stopCall():startCall();}
async function startCall(){try{await navigator.mediaDevices.getUserMedia({audio:true});}catch{return;}callOn=true;startListenAssess();}
function stopCall(){callOn=false;try{rec&&rec.stop()}catch{}speechSynthesis.cancel();micBtn.classList.remove('micPulse');}
document.addEventListener('click',e=>{if(!e.target.closest('#row')&&menuOpen)toggleMenu();if(!e.target.closest('.top')&&langOpen&&!e.target.closest('#langPanel')){langOpen=false;langPanel.classList.remove('show');}});
</script></body></html>
